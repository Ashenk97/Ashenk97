      <stop offset="0" stop-color="#1d6f64"/>
      <stop offset="1" stop-color="#3ee0c5"/>
    </linearGradient>
    <clipPath id="statsFrame">
      <rect width="1100" height="360" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#statsFrame)">
