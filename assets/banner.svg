<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title">
  <title id="title">Ashen Kavinda — Senior Software Quality Assurance Engineer</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0c5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ee0c5" stop-opacity="1"/>
      <stop offset="1" stop-color="#3ee0c5" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.6 0" to="0.6 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee0c5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ee0c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ee0c5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ee0c5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ee0c5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1100" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="360" fill="#0c1118"/>

    <g fill="#3ee0c5" opacity="0.12">
      <circle cx="90" cy="70" r="2">
        <animate attributeName="cy" values="70;92;70" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.55;0.15" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="300" r="1.6">
        <animate attributeName="cy" values="300;278;300" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="64" r="2.2">
        <animate attributeName="cy" values="64;88;64" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="250" r="1.8">
        <animate attributeName="cy" values="250;228;250" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="210" r="1.4">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="140" r="1.5">
        <animate attributeName="opacity" values="0.15;0.65;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="-80" width="1100" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;360;-80" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1098" height="358" rx="27" fill="none" stroke="#273246"/>
  <rect x="40" y="1" width="1020" height="2" fill="url(#edge)"/>

  <circle cx="550" cy="64" r="52" fill="url(#glow)">
    <animate attributeName="r" values="44;60;44" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.18;0.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="514" y="28" width="72" height="72" rx="16" fill="#3ee0c5">
    <animate attributeName="opacity" values="1;0.82;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="550" y="78" text-anchor="middle" fill="#04251f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A</text>

  <text x="550" y="132" text-anchor="middle" fill="#8f9cb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3.2">SENIOR SOFTWARE QUALITY ASSURANCE ENGINEER</text>
  <text x="550" y="180" text-anchor="middle" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Ashen Kavinda</text>
  <text x="550" y="220" text-anchor="middle" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">I lead test automation strategy and build quality systems that keep releases reliable.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="176" y="256" width="118" height="36" rx="18" fill="#121924" stroke="#3ee0c5" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="235" y="279" text-anchor="middle" fill="#3ee0c5">4+ years QA</text>

    <rect x="306" y="256" width="148" height="36" rx="18" fill="#121924" stroke="#3ee0c5" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="380" y="279" text-anchor="middle" fill="#3ee0c5">ISTQB CTAL-TAE</text>

    <rect x="466" y="256" width="196" height="36" rx="18" fill="#121924" stroke="#3ee0c5" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="564" y="279" text-anchor="middle" fill="#3ee0c5">Playwright + TypeScript</text>

    <rect x="674" y="256" width="188" height="36" rx="18" fill="#121924" stroke="#3ee0c5" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="768" y="279" text-anchor="middle" fill="#3ee0c5">Pearson+ winner 2023</text>
  </g>

  <text x="550" y="328" text-anchor="middle" fill="#8f9cb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Sri Lanka  ·  Not seeking roles</text>
</svg>
