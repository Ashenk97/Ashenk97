  <text x="550" y="180" text-anchor="middle" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Ashen Kavinda</text>
  <text x="550" y="220" text-anchor="middle" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">I lead test automation strategy and build quality systems that keep releases reliable.</text>

