<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title">
  <title id="title">Ashen Kavinda — Senior Software Quality Assurance Engineer</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0c5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ee0c5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ee0c5" stop-opacity="0"/>
