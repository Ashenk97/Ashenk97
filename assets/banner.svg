  <rect x="514" y="28" width="72" height="72" rx="16" fill="#3ee0c5"/>
  <text x="550" y="78" text-anchor="middle" fill="#04251f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A</text>

