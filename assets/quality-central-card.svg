<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title">
  <title id="title">Quality Central — gamified QA learning hub</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0c5" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#3ee0c5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3ee0c5" stop-opacity="0.15"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#0c1118"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="217" rx="22" fill="none" stroke="url(#border)" stroke-width="3"/>
  <rect x="6" y="6" width="908" height="208" rx="18" fill="url(#fill)"/>

  <rect x="28" y="28" width="56" height="56" rx="14" fill="#3ee0c5"/>
  <text x="56" y="64" text-anchor="middle" fill="#04251f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">QC</text>

  <text x="102" y="52" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Quality Central</text>
  <text x="102" y="78" fill="#8f9cb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Gamified QA learning hub · Live on Vercel</text>

  <g>
    <rect x="760" y="34" width="128" height="30" rx="15" fill="#04251f" stroke="#3ee0c5"/>
    <circle cx="780" cy="49" r="5" fill="#3ee0c5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="832" y="54" text-anchor="middle" fill="#3ee0c5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">LIVE</text>
  </g>

  <text x="28" y="128" fill="#eef3f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Zero to Advanced QA. Hunt bugs. Write reports. Pass quizzes. Unlock the next node.</text>
  <text x="28" y="158" fill="#8f9cb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">MDX lessons · API and automation playgrounds · buggy sandbox · skill tree · daily challenges</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="28" y="176" width="78" height="24" rx="12" fill="#121924" stroke="#273246"/>
    <text x="67" y="192" text-anchor="middle" fill="#3ee0c5">Next.js</text>
    <rect x="114" y="176" width="96" height="24" rx="12" fill="#121924" stroke="#273246"/>
    <text x="162" y="192" text-anchor="middle" fill="#3ee0c5">TypeScript</text>
    <rect x="218" y="176" width="92" height="24" rx="12" fill="#121924" stroke="#273246"/>
    <text x="264" y="192" text-anchor="middle" fill="#3ee0c5">Playwright</text>
    <rect x="318" y="176" width="84" height="24" rx="12" fill="#121924" stroke="#273246"/>
    <text x="360" y="192" text-anchor="middle" fill="#3ee0c5">Supabase</text>
  </g>
</svg>
